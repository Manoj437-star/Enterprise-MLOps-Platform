$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
name: team-beta-nlp-training
display_name: "Team Beta - BiLSTM NLP Sentiment Classifier Training"
description: "Trains a sentiment classifier with MLflow metrics tracking on Azure ML Compute Cluster"
experiment_name: "team-beta-nlp"

code: ../src
command: >-
  python train.py
  --epochs 5
  --batch-size 32
  --learning-rate 0.002
  --output-dir ./outputs/model

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
  conda_file: ../environment/conda.yaml

compute: azureml:cpu-cluster

resources:
  instance_count: 1

tags:
  Team: Team-Beta
  Domain: NLP
  Framework: PyTorch
  Project: Enterprise-MLOps-Platform
